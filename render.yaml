services:
  - type: web
    name: chatvoice-youtube-moderator
    runtime: node
    plan: starter
    rootDir: youtube-bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: chatvoice-youtube-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BOT_ADMIN_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: BOT_REFRESH_TOKEN
        sync: false
      - key: DATA_DIR
        value: /data
